[package]
name = "fastpda"
version = "0.1.0"
edition = "2021"
# The oldest toolchain CI builds the library with. With the MSRV-aware
# resolver (Cargo 1.84+), cargo picks dependency versions that build there;
# the newest solana-pubkey 4.x on its own needs 1.89.
rust-version = "1.85"
description = "Solana program-derived addresses (PDAs), bit-for-bit solana-pubkey's, about 3x faster: the on-curve test is a Jacobi symbol instead of a point decompression"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vas11111/fastpda"
documentation = "https://docs.rs/fastpda"
readme = "README.md"
keywords = ["solana", "pda", "ed25519", "curve25519", "jacobi"]
categories = ["cryptography", "no-std"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/reference",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["solana-pubkey"]
# `solana-pubkey` (an optional dependency, so also a feature): the `Pubkey`
# functions at the crate root. Without it the crate has only the byte-array
# API in `fastpda::bytes` and `is_on_curve`, and depends on nothing from Solana.

[dependencies]
# Formally verified arithmetic mod 2^255 - 19, generated by the fiat-crypto
# project (curve25519-dalek's `fiat` backend uses the same code).
fiat-crypto = { version = "0.3", default-features = false }
# 0.11 picks the SHA-256 instructions at runtime on aarch64 and x86-64.
sha2 = { version = "0.11", default-features = false }
solana-pubkey = { version = "4", default-features = false, optional = true }

[dev-dependencies]
# The references the tests and benches compare against: solana-pubkey's own
# derivation (which needs its `curve25519` feature) and curve25519-dalek's
# decompression, which is what solana-pubkey's on-curve test runs.
solana-pubkey = { version = "4", features = ["curve25519"] }
curve25519-dalek = "4.1.3"
num-bigint = "0.4"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }

# solana-pubkey hashes with sha2 0.10, which uses the ARMv8 SHA-256
# instructions only with its `asm` feature. Turn it on for the tests and
# benches so both sides hash in hardware and the comparison times the
# on-curve test, not two different SHA-256 implementations. On x86-64 sha2
# 0.10 already picks SHA-NI at runtime.
[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
sha2_0_10 = { package = "sha2", version = "0.10", features = ["asm"] }

[[bench]]
name = "pda"
harness = false
# It times the `Pubkey` functions, the drop-in replacements.
required-features = ["solana-pubkey"]

[profile.bench]
codegen-units = 1
lto = "fat"

# Tests compare against curve25519-dalek, solana-pubkey and num-bigint on
# hundreds of thousands of inputs: optimize the dependencies even in debug
# builds, while this crate keeps its debug assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 3
