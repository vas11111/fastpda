name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:17 UTC: the long sweeps and a fuzzing run.
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --locked --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      # The benches build (they are not timed here).
      - run: cargo bench --locked --no-run
      # The known-answer file is exactly what the Python reference writes.
      - run: python3 reference/pda_reference.py --check

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Resolve dependencies the way a user on the MSRV gets them: the newest
      # versions whose rust-version allows it (Cargo 1.84+ resolver).
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo +1.85 build --locked --lib
      - run: cargo +1.85 build --locked --lib --no-default-features

  sweeps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 100M on-curve tests against curve25519-dalek, 10M seed lists against
      # solana-pubkey, 10M numbers against Euler's criterion. Each prints its
      # seed; FASTPDA_SEED reruns it.
      - run: cargo test --locked --release -- --ignored sweep --nocapture --test-threads=1

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run differential -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
