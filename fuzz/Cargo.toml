[package]
name = "fastpda-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fastpda = { path = ".." }
# The references: solana-pubkey's own derivation and curve25519-dalek's
# decompression (what solana-pubkey's on-curve test runs).
solana-pubkey = { version = "4", features = ["curve25519"] }
curve25519-dalek = "4.1.3"

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

# Not part of the crate's build.
[workspace]
